function rBracket() {
  if (!S.bracket) return '<div class="empty">No bracket yet. Go to Setup and generate one.</div>';
  const b = S.bracket;
  let out = '';
  const rdAccess = Gates.canAccess('throwdown_redemption');
  const wcAccess = Gates.canAccess('throwdown_revival');

  // Manual bracket assignment mode
  if (b.phase === 'manual-setup') {
    const names = S.participants.map(p => p.name);
    const round = b.rounds[0];
    const usedNames = round.pairs.flatMap(p => [p.t1, p.t2]).filter(Boolean);
    const opts = (selected, pairId, pos) =>
      '<option value="">— empty (bye) —</option>'
      + names.map(n => {
          const taken = usedNames.includes(n) && n !== selected;
          return '<option value="'+n+'"'+(n===selected?' selected':'')+(taken?' disabled':'')+'>'+n+'</option>';
        }).join('');

    out += '<div style="margin-bottom:1rem">'
      + '<div style="font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:.5rem">Assign participants to bracket slots. Empty slots become byes on start.</div>'
      + round.pairs.map((p, i) => {
          const slotNum = i * 2;
          return '<div style="display:flex;align-items:center;gap:10px;padding:.6rem .9rem;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rad);margin-bottom:6px">'
            + '<span style="font-size:11px;font-weight:700;color:var(--txt3);min-width:52px">Match '+(i+1)+'</span>'
            + '<select class="ms-sel" data-pair="'+p.id+'" data-pos="t1" style="flex:1">'+opts(p.t1, p.id, 't1')+'</select>'
            + '<span style="font-size:11px;color:var(--txt3);flex-shrink:0">vs</span>'
            + '<select class="ms-sel" data-pair="'+p.id+'" data-pos="t2" style="flex:1">'+opts(p.t2, p.id, 't2')+'</select>'
            + '</div>';
        }).join('')
      + '</div>'
      + '<button class="btn-p" id="start-manual">▶ Start bracket</button>';
    return out;
  }
  const revivedNames = b.revivedNames || [];
  const revivedBadge = '<span style="display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:700;color:var(--pu);background:var(--pu-bg);border:1px solid var(--pu-bd);border-radius:3px;padding:1px 5px;margin-left:5px;vertical-align:middle">⬆ R</span>';

  // One redemption group as a Bracket-tab card. Reuses the pair card's .bslot-*
  // classes verbatim — a pool card is the same card with N rows instead of two,
  // so it needs no new CSS (.bslot.redemption and .bslot.redemption.active
  // already exist). Crucially it emits the data-score button the pair path
  // emits: renderRedemptionScoreModal() has been complete since v3.0.1 but
  // openScoring() was only ever reachable from a button no surface rendered.
  const rdPoolCard = (g, round, col, gi) => {
    const v = redemptionGroupView(g, revivedNames);
    const isCurrent = !isRoundComplete(round);
    const cls = v.settled ? ' done' : isCurrent ? ' active' : '';

    const rows = v.brewers.map((br, i) =>
        (i ? '<div class="bslot-divider"></div>' : '')
      + '<div class="bslot-team'+(br.isWinner?' winner-row':'')+'">'
      + '<span class="bslot-name'+(v.settled ? (br.isWinner?' winner':' loser') : '')+'">'
      + br.name + (br.isRevived ? revivedBadge : '') + '</span>'
      + (br.votes > 0 ? '<span class="bslot-votes">'+br.votes+'</span>' : '')
      + '</div>'
    ).join('');

    let footer;
    if (v.settled) {
      footer = '<div class="bslot-footer"><span class="bslot-status done-lbl">🏆 '+v.winner+' advances'
        + (v.tiebreaker ? ' · tiebreaker' : '')
        + '</span><button class="btn-sm btn-o" style="font-size:10px" data-reopen="'+g.id+'">Edit</button></div>';
    } else if (isCurrent) {
      footer = '<div class="bslot-footer"><span class="bslot-status ready">Ready to score</span>'
        + '<button class="btn-sm btn-am" data-score="'+g.id+'">▶ Score</button></div>';
    } else {
      footer = '<div class="bslot-footer"><span class="bslot-status">⏳ Awaiting previous results</span></div>';
    }

    return '<div class="bslot'+cls+' redemption" style="border-top-color:'+col.fg+'">'
      + '<div class="bslot-hdr" style="background:'+col.bg+';color:'+col.fg+'">'
      + '<span>Group '+(gi+1)+' · '+v.brewers.length+' brewers</span>'
      + (v.totalVotes ? '<span style="font-size:10px">'+v.totalVotes+' / '+S.judges+' votes</span>' : '')
      + '</div>'
      + '<div class="bslot-teams">'+rows+'</div>' + footer + '</div>';
  };

  b.rounds.forEach((round, ri) => {
    const isRd = isPoolRound(round);
    const col = roundColour(round.label, round.phase);
    out += '<div class="bracket-section">'
      + '<div class="section-title" style="color:'+col.fg+';border-left:3px solid '+col.fg+';padding-left:8px">'
      + (isRd ? '🔄 ' : round.phase === 'third' ? '🥉 ' : '⚔️ ')
      + round.label
      + (isRd ? ' <span class="badge badge-pu" style="font-size:9px">Redemption</span>' : '')
      + (round.phase === 'third' ? ' <span class="badge badge-bl" style="font-size:9px">3rd Place</span>' : '')
      + '</div>'
      + round.pairs.map((pair, pi) => {
          // A redemption round's entries are groups, not pairs — reading t1/t2
          // off them is what rendered TBD/TBD with no Score button (POA-71).
          if (isRd) return rdPoolCard(pair, round, col, pi);

          const isCurrent = !isRoundComplete(round);
          const isDone = pair.winner !== null;
          const hasBoth = pair.t1 && pair.t2 && !pair.bye;
          const cls = pair.bye ? '' : isDone ? ' done' : hasBoth && isCurrent ? ' active' : '';
          const rdCls = '';
          const t1revived = revivedNames.includes(pair.t1);
          const t2revived = pair.t2 && revivedNames.includes(pair.t2);

          let footer = '';
          if (pair.bye) {
            footer = '<div class="bslot-footer"><span class="bslot-status bye">🎫 Bye — advances automatically</span></div>';
          } else if (isDone) {
            footer = '<div class="bslot-footer"><span class="bslot-status done-lbl">🏆 '+pair.winner+' advances</span><button class="btn-sm btn-o" style="font-size:10px" data-reopen="'+pair.id+'">Edit</button></div>';
          } else if (hasBoth && isCurrent) {
            footer = '<div class="bslot-footer"><span class="bslot-status ready">Ready to score</span><button class="btn-sm btn-am" data-score="'+pair.id+'">▶ Score</button></div>';
          } else {
            footer = '<div class="bslot-footer"><span class="bslot-status">⏳ Awaiting previous results</span></div>';
          }

          const t1cls = isDone ? (pair.t1===pair.winner?' winner':' loser') : '';
          const t2cls = isDone ? (pair.t2===pair.winner?' winner':' loser') : '';

          return '<div class="bslot'+cls+rdCls+'" style="border-top-color:'+col.fg+'">'
            + '<div class="bslot-hdr" style="background:'+col.bg+';color:'+col.fg+'"><span>'+round.label+'</span>'+(pair.votes1||pair.votes2?'<span style="font-size:10px">'+pair.votes1+' – '+pair.votes2+'</span>':'')+'</div>'
            + '<div class="bslot-teams">'
            + '<div class="bslot-team'+(pair.t1===pair.winner?' winner-row':'')+'"><span class="bslot-name'+(pair.t1?t1cls:' tbd')+'">'+(pair.t1||'TBD')+(t1revived?revivedBadge:'')+'</span>'+(pair.votes1>0?'<span class="bslot-votes">'+pair.votes1+'</span>':'')+'</div>'
            + (pair.bye ? '' : '<div class="bslot-divider"></div><div class="bslot-team'+(pair.t2===pair.winner?' winner-row':'')+'"><span class="bslot-name'+(pair.t2?t2cls:' tbd')+'">'+(pair.t2||'TBD')+(t2revived?revivedBadge:'')+'</span>'+(pair.votes2>0?'<span class="bslot-votes">'+pair.votes2+'</span>':'')+'</div>')
            + '</div>'+footer+'</div>';
        }).join('')
      + '</div>';
  });

  // Revival draw pending — show draw interface
  if (wcAccess.allowed && b.pendingWildCard) {
    const losers = b.pendingWildCardLosers || [];
    out += '<div style="padding:1.25rem;background:var(--pu-bg);border:2px solid var(--pu-bd);border-radius:var(--rad);margin-bottom:1rem">'
      + '<div style="font-size:11px;font-weight:700;color:var(--pu);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px">🃏 Revival Draw</div>'
      + '<p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Round complete. Draw a revival to randomly revive one eliminated competitor, or skip to continue.</p>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<button class="btn-p" id="do-draw-wc" style="background:var(--pu);border-color:var(--pu)">🃏 Revival Draw ('+ losers.length +' in pool)</button>'
      + '<button class="btn-o" id="skip-wc">Skip → Continue</button>'
      + '</div></div>';
  }

  // Revival draw just drawn — show reveal
  if (wcAccess.allowed && S.wildCard && b.wildCards) {
    const latest = Object.entries(b.wildCards).filter(([,v])=>v).slice(-1)[0];
    if (latest && b.rounds.length > 0) {
      const drawnRound = +latest[0];
      const drawnName = latest[1];
      const justDone = b.mainRoundsDone === drawnRound;
      if (justDone) {
        out += '<div style="padding:1.25rem;background:var(--pu-bg);border:2px solid var(--pu-bd);border-radius:var(--rad);margin-bottom:1rem;text-align:center">'
          + '<div style="font-size:11px;font-weight:700;color:var(--pu);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px">🃏 Revival Draw!</div>'
          + '<div style="font-size:22px;font-weight:700;color:var(--pu);margin-bottom:4px">'+drawnName+'</div>'
          + '<p style="font-size:12px;color:var(--txt3);margin-bottom:12px">Revived and entering the next round</p>'
          + '<button class="btn-p" id="wc-continue" data-round="'+drawnRound+'" style="background:var(--pu);border-color:var(--pu)">Continue → Next Round</button>'
          + '</div>';
      }
    }
  }

  // Lucky loser pending — show draw interface
  if (rdAccess.allowed && b.pendingLuckyLoser && !b.pendingLuckyLoser.done) {
    const pending = b.pendingLuckyLoser;
    const drawn = b.luckyLosers || [];
    out += '<div style="padding:1.25rem;background:var(--pu-bg);border:2px solid var(--pu-bd);border-radius:var(--rad);margin-bottom:1rem">'
      + '<div style="font-size:11px;font-weight:700;color:var(--pu);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px">🎲 Lucky Loser Draw</div>'
      + '<p style="font-size:13px;color:var(--txt2);margin-bottom:8px">Redemption round complete — '+(drawn.length)+' of '+(drawn.length + pending.slotsNeeded)+' lucky loser'+(drawn.length + pending.slotsNeeded > 1 ? 's' : '')+' drawn.</p>'
      + (drawn.length ? '<div style="margin-bottom:10px">'+drawn.map(n=>'<span style="display:inline-block;font-size:13px;font-weight:700;color:var(--pu);background:#fff;border:1.5px solid var(--pu-bd);border-radius:var(--rad-s);padding:3px 10px;margin:2px 4px 2px 0">'+n+' ⬆ R</span>').join('')+'</div>' : '')
      + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<button class="btn-p" id="do-draw-ll" style="background:var(--pu);border-color:var(--pu)">🎲 Draw Lucky Loser ('+pending.slotsNeeded+' remaining · '+pending.pool.length+' in pool)</button>'
      + '</div></div>';
  }

  // Lucky loser all drawn — show continue
  if (rdAccess.allowed && b.pendingLuckyLoser && b.pendingLuckyLoser.done) {
    const drawn = b.luckyLosers || [];
    out += '<div style="padding:1.25rem;background:var(--pu-bg);border:2px solid var(--pu-bd);border-radius:var(--rad);margin-bottom:1rem;text-align:center">'
      + '<div style="font-size:11px;font-weight:700;color:var(--pu);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px">🎲 Lucky Losers Drawn!</div>'
      + '<div style="margin-bottom:10px">'+drawn.map(n=>'<div style="font-size:20px;font-weight:700;color:var(--pu);margin-bottom:4px">'+n+' ⬆ R</div>').join('')+'</div>'
      + '<p style="font-size:12px;color:var(--txt3);margin-bottom:12px">Revived and entering the next round</p>'
      + '<button class="btn-p" id="ll-continue" style="background:var(--pu);border-color:var(--pu)">Continue → Next Round</button>'
      + '</div>';
  }

  if (b.phase === 'done') {
    const finalRound = b.rounds.filter(r => r.phase === 'main' && r.label === 'Final').slice(-1)[0];
    const thirdRound = b.rounds.filter(r => r.phase === 'third').slice(-1)[0];
    const finalPair  = finalRound?.pairs[0];
    const thirdPair  = thirdRound?.pairs[0];
    if (finalPair) {
      out += '<div style="padding:1.5rem;background:var(--am-bg);border:2px solid var(--am-bd);border-radius:var(--rad);text-align:center;margin-top:.5rem">'
        + '<div style="font-size:11px;font-weight:700;color:var(--am);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px">🏆 Champion</div>'
        + '<div style="font-size:26px;font-weight:700;color:var(--am);margin-bottom:2px">'+finalPair.winner+'</div>'
        + (finalPair.loser ? '<div style="font-size:13px;color:var(--txt3)">🥈 '+finalPair.loser+'</div>' : '')
        + (thirdPair?.winner ? '<div style="font-size:13px;color:var(--txt3);margin-top:6px">🥉 '+thirdPair.winner+'</div>' : '')
        + '</div>';
    }
  }
  return out || '<div class="empty">Bracket is empty.</div>';
}

function rHistory() {
  if (!S.bracket) return '<div class="empty">No bracket generated yet.</div>';
  const revivedNames = S.bracket.revivedNames || [];
  const done = S.bracket.rounds.flatMap(r => r.pairs.filter(p => p.winner && !p.bye).map(p => ({...p, roundLabel: r.label, phase: r.phase})));
  if (!done.length) return '<div class="empty">No matches completed yet.</div>';
  return '<div style="display:flex;flex-direction:column;gap:7px">'
    + done.map(p => {
        const col = roundColour(p.roundLabel, p.phase);
        const revBadge = name => revivedNames.includes(name)
          ? ' <span style="font-size:9px;font-weight:700;color:var(--pu);background:var(--pu-bg);border:1px solid var(--pu-bd);border-radius:3px;padding:1px 4px">⬆ R</span>'
          : '';

        // Third instance of the same pair-shape assumption (POA-64 named this
        // one in its own ticket: "same done.map() pattern reading p.t1/
        // p.votes1, looks like the identical bug"). It was. .hr-row already
        // wraps and .hr-rb.rd already exists, so N brewers need no new CSS.
        if (p.phase === 'redemption') {
          const v = redemptionGroupView(p, revivedNames);
          return '<div class="hr-row" style="border-left:3px solid '+col.fg+'">'
            + '<div class="hr-rb rd">'+p.roundLabel+'</div>'
            + v.brewers.map((br, i) =>
                (i ? '<div class="hvs">·</div>' : '')
                + '<div class="hr-t'+(br.isWinner?' w':'')+'">'+br.name+revBadge(br.name)+'</div>'
                + '<div class="hr-v" style="color:'+(br.isWinner?'var(--am)':'var(--txt3)')+'">'+br.votes+'</div>'
              ).join('')
            + (v.tiebreaker ? '<div class="hvs" style="color:var(--pu)">tiebreaker</div>' : '')
            + '</div>';
        }

        return '<div class="hr-row" style="border-left:3px solid '+col.fg+'">'
          + '<div class="hr-rb" style="background:'+col.bg+';border-color:'+col.bd+';color:'+col.fg+'">'+p.roundLabel+'</div>'
          + '<div class="hr-t'+(p.winner===p.t1?' w':'')+'">'+p.t1+revBadge(p.t1)+'</div>'
          + '<div class="hr-v" style="color:'+(p.winner===p.t1?'var(--am)':'var(--txt3)')+'">'+p.votes1+'</div>'
          + '<div class="hvs">vs</div>'
          + '<div class="hr-v" style="color:'+(p.winner===p.t2?'var(--am)':'var(--txt3)')+'">'+p.votes2+'</div>'
          + '<div class="hr-t'+(p.winner===p.t2?' w':'')+'" style="text-align:right">'+p.t2+revBadge(p.t2)+'</div>'
          + '</div>';
      }).join('')
    + '</div>';
}

/* ── Round colour helper ── */
function roundColour(label, phase) {
  if (phase === 'redemption') return { bg: 'var(--pu-bg)', bd: 'var(--pu-bd)', fg: 'var(--pu)' };
  if (phase === 'third')      return { bg: 'var(--bl-bg)', bd: 'var(--bl-bd)', fg: 'var(--bl)' };
  const l = label.toLowerCase();
  if (l === 'final')         return { bg: 'var(--gn-bg)', bd: 'var(--gn-bd)', fg: 'var(--gn)' };
  if (l.includes('semi'))    return { bg: 'var(--am-bg)', bd: 'var(--am-bd)', fg: 'var(--am)' };
  if (l.includes('quarter')) return { bg: 'var(--bl-bg)', bd: 'var(--bl-bd)', fg: 'var(--bl)' };
  if (l.includes('round 1')) return { bg: 'var(--bg)',    bd: 'var(--border)', fg: 'var(--txt3)' };
  // Round 2, 3, etc.
  return { bg: 'var(--bl-bg)', bd: 'var(--bl-bd)', fg: 'var(--bl)' };
}

/* Hardcoded hex per round — print context, same reasoning as audCol() in showAudience() */
function pdfRoundColour(label, phase) {
  if (phase === 'redemption') return { bg: '#DDD6FE', fg: '#5B21B6' };
  if (phase === 'third')      return { bg: '#BFDBFE', fg: '#1D4ED8' };
  const l = label.toLowerCase();
  if (l === 'final')         return { bg: '#A7F3D0', fg: '#065F46' };
  if (l.includes('semi'))    return { bg: '#FDE68A', fg: '#92400E' };
  if (l.includes('quarter')) return { bg: '#BFDBFE', fg: '#1D4ED8' };
  if (l.includes('round 1')) return { bg: '#E5E7EB', fg: '#374151' };
  return { bg: '#BFDBFE', fg: '#1D4ED8' };
}

/* ── Audience ── */
function showAudience() {
  EventConfig.writeHandoff();
  const revivedNames = S.bracket ? (S.bracket.revivedNames || []) : [];

  // Saturated hex per CONVENTIONS — boosted for projector output
  function audCol(label, phase) {
    if (phase === 'redemption') return { bg:'#DDD6FE', bd:'#7C3AED', fg:'#5B21B6', bar:'#7C3AED' };
    if (phase === 'third')      return { bg:'#BFDBFE', bd:'#2563EB', fg:'#1D4ED8', bar:'#2563EB' };
    const l = label.toLowerCase();
    if (l === 'final')         return { bg:'#A7F3D0', bd:'#059669', fg:'#065F46', bar:'#059669' };
    if (l.includes('semi'))    return { bg:'#FDE68A', bd:'#D97706', fg:'#92400E', bar:'#D97706' };
    if (l.includes('quarter')) return { bg:'#BFDBFE', bd:'#2563EB', fg:'#1D4ED8', bar:'#2563EB' };
    if (l.includes('round 1')) return { bg:'#E5E7EB', bd:'#6B7280', fg:'#374151', bar:'#6B7280' };
    return { bg:'#BFDBFE', bd:'#2563EB', fg:'#1D4ED8', bar:'#2563EB' };
  }

  const revBadge = '<span style="font-size:10px;font-weight:700;color:#5B21B6;background:#DDD6FE;border:1.5px solid #7C3AED;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;flex-shrink:0">⬆ R</span>';

  const done = S.bracket
    ? S.bracket.rounds.flatMap(r => r.pairs.filter(p => p.winner && !p.bye).map(p => ({...p, roundLabel: r.label, phase: r.phase}))).reverse()
    : [];

  // Group by round label for section dividers
  const grouped = [];
  done.forEach(p => {
    const last = grouped[grouped.length - 1];
    if (last && last.label === p.roundLabel) { last.matches.push(p); }
    else { grouped.push({ label: p.roundLabel, phase: p.phase, matches: [p] }); }
  });

  // A resolved redemption group, for the audience overlay. Same defect and the
  // same fix as the Bracket tab's rdPoolCard (POA-71) — this function read
  // p.t1/p.votes1 off a group that has neither and printed
  // "undefined undefined vs undefined undefined" (POA-64). Sibling of that fix,
  // not a neighbour: one false assumption, two functions, same file.
  // Presentation is deliberately NOT shared — a pool of three has no "A vs B"
  // row to borrow, and this surface is projector-scale hardcoded hex per
  // CONVENTIONS, not the Bracket tab's token-driven cards.
  function rdAudRow(g, col) {
    const v = redemptionGroupView(g, revivedNames);
    return '<div style="padding:.75rem 1rem;background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.10)">'
      + v.brewers.map(br =>
          '<div style="display:flex;align-items:center;gap:10px;padding:3px 0">'
          + '<span style="flex:1;font-size:17px;font-weight:'+(br.isWinner?800:500)+';color:'+(br.isWinner?'#1C1917':'#9CA3AF')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+br.name+'</span>'
          + (br.isRevived ? revBadge : '')
          + '<div style="font-size:28px;font-weight:900;color:'+(br.isWinner?col.bar:'#D1D5DB')+';flex-shrink:0;min-width:34px;text-align:center;line-height:1">'+br.votes+'</div>'
          + '</div>'
        ).join('')
      // Stated outright, because a tiebreak group's votes are genuinely tied —
      // the room would otherwise see a tie with a winner and no explanation.
      + (v.tiebreaker ? '<div style="font-size:12px;font-weight:800;color:'+col.fg+';text-align:right;padding-top:5px">Tiebreaker → '+v.winner+'</div>' : '')
      + '</div>';
  }

  const histHTML = grouped.length ? grouped.map(group => {
    const col = audCol(group.label, group.phase);
    const matchRows = group.matches.map(p => {
      if (p.phase === 'redemption') return rdAudRow(p, col);

      const t1win = p.winner === p.t1;
      const t2win = p.winner === p.t2;
      const t1rev = revivedNames.includes(p.t1);
      const t2rev = p.t2 && revivedNames.includes(p.t2);
      return '<div style="display:flex;align-items:center;gap:10px;padding:.75rem 1rem;background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.10)">'
        + '<div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0">'
        + '<span style="font-size:17px;font-weight:'+(t1win?800:500)+';color:'+(t1win?'#1C1917':'#9CA3AF')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.t1+'</span>'
        + (t1rev ? revBadge : '')
        + '</div>'
        + '<div style="font-size:28px;font-weight:900;color:'+(t1win?col.bar:'#D1D5DB')+';flex-shrink:0;min-width:34px;text-align:center;line-height:1">'+p.votes1+'</div>'
        + '<div style="font-size:11px;font-weight:700;color:#9CA3AF;flex-shrink:0;padding:0 2px">vs</div>'
        + '<div style="font-size:28px;font-weight:900;color:'+(t2win?col.bar:'#D1D5DB')+';flex-shrink:0;min-width:34px;text-align:center;line-height:1">'+p.votes2+'</div>'
        + '<div style="flex:1;display:flex;align-items:center;gap:6px;min-width:0">'
        + (t2rev ? revBadge : '')
        + '<span style="font-size:17px;font-weight:'+(t2win?800:500)+';color:'+(t2win?'#1C1917':'#9CA3AF')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.t2+'</span>'
        + '</div>'
        + '</div>';
    }).join('');

    return '<div style="margin-bottom:20px">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
      + '<div style="height:3px;flex:1;background:'+col.bar+';border-radius:2px;opacity:.35"></div>'
      + '<div style="font-size:11px;font-weight:800;color:'+col.fg+';background:'+col.bg+';border:2px solid '+col.bd+';border-radius:5px;padding:3px 10px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap">'+group.label+'</div>'
      + '<div style="height:3px;flex:1;background:'+col.bar+';border-radius:2px;opacity:.35"></div>'
      + '</div>'
      + matchRows
      + '</div>';
  }).join('') : '';

  // Module tag — current round label or Final when done
  const activeRound = getActiveRound();
  const moduleTag = S.bracket
    ? (S.bracket.phase === 'done' ? 'Final' : (activeRound?.label || 'Live'))
    : '';

  // Podium data — built when bracket is complete
  let podiumData = null;
  if (S.bracket?.phase === 'done') {
    const finalRound = S.bracket.rounds.filter(r => r.phase === 'main' && r.label === 'Final').slice(-1)[0];
    const thirdRound = S.bracket.rounds.filter(r => r.phase === 'third').slice(-1)[0];
    const finalPair  = finalRound?.pairs[0];
    if (finalPair?.winner) {
      const sfLosers = S.bracket.rounds
        .filter(r => r.label === 'Semi Finals')
        .flatMap(r => r.pairs.filter(p => p.loser).map(p => p.loser));
      const rank3 = thirdRound?.pairs[0]?.winner || sfLosers.join(' · ');
      podiumData = [
        { rank: 1, name: finalPair.winner },
        { rank: 2, name: finalPair.loser || '' },
        { rank: 3, name: rank3 },
      ].filter(d => d.name);
    }
  }

  Audience.show({
    title: S.eventName || 'Throwdown 1v1',
    moduleTag,
    histHTML,
    podium: podiumData,
  });
}

/* ── PDF export (POA-55, shared/pdf.js) ── */
function generateThrowdownPDF() {
  const b = S.bracket;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  // Podium — same lookup as maybeArchiveChampion/showAudience
  const finalRound = b?.rounds.filter(r => r.phase === 'main' && r.label === 'Final').slice(-1)[0];
  const thirdRound = b?.rounds.filter(r => r.phase === 'third').slice(-1)[0];
  const finalPair  = finalRound?.pairs[0];
  const thirdPair  = thirdRound?.pairs[0];
  const sfLosers = b
    ? b.rounds.filter(r => r.label === 'Semi Finals').flatMap(r => r.pairs.filter(p => p.loser).map(p => p.loser))
    : [];
  const rank3 = thirdPair?.winner || sfLosers.join(' · ');

  const podiumHtml = finalPair?.winner
    ? '<div class="pdf-td-podium">'
      + '<div class="pdf-td-podium-tile champ"><div class="pdf-td-podium-label">🏆 Champion</div><div class="pdf-td-podium-name">' + finalPair.winner + '</div></div>'
      + (finalPair.loser ? '<div class="pdf-td-podium-tile"><div class="pdf-td-podium-label">🥈 Runner Up</div><div class="pdf-td-podium-name">' + finalPair.loser + '</div></div>' : '')
      + (rank3 ? '<div class="pdf-td-podium-tile"><div class="pdf-td-podium-label">🥉 3rd Place</div><div class="pdf-td-podium-name">' + rank3 + '</div></div>' : '')
      + '</div>'
    : '<p class="hint">Tournament still in progress — no champion confirmed yet.</p>';

  // Match log — same data source as rHistory()
  const done = b
    ? b.rounds.flatMap(r => r.pairs.filter(p => p.winner && !p.bye).map(p => ({ ...p, roundLabel: r.label })))
    : [];
  const matchRows = done.map(p =>
    '<tr>'
    + '<td><span class="pdf-td-rb">' + p.roundLabel + '</span></td>'
    + '<td class="' + (p.winner === p.t1 ? 'pdf-td-win' : '') + '">' + p.t1 + '</td>'
    + '<td style="text-align:center">' + p.votes1 + '</td>'
    + '<td style="text-align:center;color:#8a7f73;font-size:11px">vs</td>'
    + '<td style="text-align:center">' + p.votes2 + '</td>'
    + '<td class="' + (p.winner === p.t2 ? 'pdf-td-win' : '') + '" style="text-align:right">' + p.t2 + '</td>'
    + '</tr>'
  ).join('');

  const resultsBody = podiumHtml
    + '<div class="pdf-td-subhead">Match Results</div>'
    + '<table class="pdf-td-match-table"><thead><tr><th>Round</th><th>Team 1</th><th style="text-align:center">Score</th><th></th><th style="text-align:center">Score</th><th style="text-align:right">Team 2</th></tr></thead><tbody>'
    + (matchRows || '<tr><td colspan="6" style="text-align:center;color:#8a7f73;padding:20px">No completed matches yet.</td></tr>')
    + '</tbody></table>';

  // Bracket — Throwdown renders its live bracket as plain HTML/CSS (.bslot divs), no
  // canvas/SVG, so it drops into a print bodyHtml string the same way the results page does.
  const bracketBody = b
    ? b.rounds.map(round => {
        const col = pdfRoundColour(round.label, round.phase);
        const matches = round.pairs.map(p => {
          const t1cls = p.winner ? (p.winner === p.t1 ? 'winner' : 'loser') : '';
          const t2cls = p.bye ? '' : (p.winner ? (p.winner === p.t2 ? 'winner' : 'loser') : '');
          return '<div class="pdf-td-bracket-match">'
            + '<span class="pdf-td-bracket-team ' + t1cls + '">' + (p.t1 || 'TBD') + '</span>'
            + '<span class="pdf-td-bracket-score">' + (p.votes1 || 0) + ' – ' + (p.votes2 || 0) + '</span>'
            + '<span class="pdf-td-bracket-team ' + t2cls + '" style="text-align:right">' + (p.bye ? 'BYE' : (p.t2 || 'TBD')) + '</span>'
            + '</div>';
        }).join('');
        return '<div class="pdf-td-bracket-round">'
          + '<span class="pdf-td-bracket-round-hdr" style="background:' + col.bg + ';color:' + col.fg + '">' + round.label + '</span>'
          + matches
          + '</div>';
      }).join('')
    : '<p class="hint">No bracket generated yet.</p>';

  PdfExport.open({
    fallbackTitle: 'Throwdown 1v1',
    pages: [
      { sectionTitle: 'Final Results', metaHtml: 'Results Report<br>' + dateStr, bodyHtml: resultsBody },
      { sectionTitle: 'Bracket',       metaHtml: 'Full Bracket<br>' + dateStr,   bodyHtml: bracketBody },
    ],
  });
}

/* ── Seduh Records archive (POA-40) ──
   Fires once per event, as a side effect of the shared champion-confirmation
   choke point (render(), called by every path that sets b.phase = 'done').
   Non-blocking, fail-open — never awaited by render(), errors caught silently. */
function computeParticipantRounds(b) {
  const reached = {};
  b.rounds.forEach(r => {
    const names = r.phase === 'redemption' ? (r.pairs.flatMap(p => p.brewers || [])) : r.pairs.flatMap(p => [p.t1, p.t2].filter(Boolean));
    names.forEach(n => { reached[n] = r.label; }); // later rounds overwrite — furthest round reached
  });
  return reached;
}

function maybeArchiveChampion() {
  const b = S.bracket;
  if (!b || b.phase !== 'done' || b._archived) return;
  const finalRound = b.rounds.filter(r => r.phase === 'main' && r.label === 'Final').slice(-1)[0];
  const finalPair = finalRound?.pairs[0];
  if (!finalPair?.winner) return; // event abandoned mid-bracket — no confirmed champion, no write

  b._archived = true; // set + persist immediately so a reload can never re-fire this
  save();

  const reached = computeParticipantRounds(b);
  const record = {
    eventName: S.eventName || '',
    eventDate: S.eventDate || '', // string, not timestamp — see CHANGELOG (spec deviation)
    orgId: window._tdUid || null,
    champion: finalPair.winner,
    runnerUp: finalPair.loser || '',
    participants: S.participants.map(p => ({ name: p.name, roundReached: reached[p.name] || 'Round 1' })),
    revivalUsed: b.revivedNames || [],
    redemptionUsed: !!S.redemption,
    isTest: S.isTest !== false,
  };
  archiveThrowdownRecord(record);
}

async function archiveThrowdownRecord(record) {
  try {
    const { collection, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    await addDoc(collection(window._sdDb, 'throwdown_records'), { ...record, createdAt: serverTimestamp() });
  } catch (e) {
    // Fail silently by design — localStorage remains the record of truth for this event.
    console.warn('Seduh Records archive failed (non-blocking):', e);
  }
}

/* ── POA-63 Phase 2: live remote display ──────────────────────────────────
   Writes are PUBLISH-GATED (BRACKET-LIVE-SPEC.md §2C). Scoring stays local and
   immediate exactly as before; a separate, explicit organiser action pushes the
   result to throwdown_live/{orgId}. The in-venue screen must FOLLOW the MC's
   announcement, not pre-empt it — at a latte art throwdown the reveal is the
   moment, and a screen that updates the instant a score is typed spoils it. */

const TD_LIVE_COLL = 'throwdown_live';

// Sentinel meaning "remove this key from the document". Writes use merge:true,
// so simply omitting a field LEAVES ANY PREVIOUS VALUE IN PLACE — which would
// let a paying org's branding survive in a world-readable document after it
// drops to Community and restarts. Mapped to Firestore's deleteField() inside
// tdLiveWrite(), so the firestore import stays in exactly one place.
const TD_DELETE = '__td_delete__';

// SINGLE WRITE HOOK. Every throwdown_live write goes through this one function
// — there is deliberately no other set()/update() call site in this module.
//
// Fail-open, log-only: a failed projector sync must NEVER block or interrupt
// local scoring, and must NEVER surface a user-facing error dialog. Console
// only, then continue. Same principle as POA-40's archive write and
// competition-day auth. Returns true/false so callers can update UI, but a
// false return is never an error path — just "not synced".
async function tdLiveWrite(fields, label) {
  const orgId = window._tdUid || null;
  if (!orgId) {
    console.warn('[throwdown_live] not signed in — ' + label + ' skipped (non-blocking)');
    return false;
  }
  try {
    const { doc, setDoc, serverTimestamp, deleteField } =
      await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const payload = { orgId: orgId, updatedAt: serverTimestamp() };
    Object.keys(fields).forEach(function (k) {
      payload[k] = fields[k] === TD_DELETE ? deleteField() : fields[k];
    });
    await setDoc(
      doc(window._sdDb, TD_LIVE_COLL, orgId),
      payload,
      { merge: true } // branding is written once at start; publishes must not clear it
    );
    return true;
  } catch (e) {
    console.warn('[throwdown_live] ' + label + ' failed (non-blocking):', e);
    return false;
  }
}

// The bracket half of the document — BRACKET-LIVE-SPEC.md §3, straight from the
// translation layer. Never includes branding or `active`; those are start-time
// concerns and merge:true keeps them intact across publishes.
function tdLiveBracketFields() {
  const d = buildLiveBracketData(S.bracket, S.participants);
  return { bracketSize: d.bracketSize, rounds: d.rounds, champion: d.champion, runnerUp: d.runnerUp };
}

function tdHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return String(h);
}

function tdLiveFingerprint() {
  try { return tdHash(JSON.stringify(tdLiveBracketFields())); } catch (e) { return ''; }
}

// Drives the "unpublished changes" dot. Publish-gating's one real competition-day
// failure mode is the organiser forgetting to publish after announcing, so the
// button says when the screen is behind the local bracket.
function tdLiveHasUnpublished() {
  return !!S.remoteActive && S.remotePubHash !== tdLiveFingerprint();
}

function tdViewerUrls() {
  const orgId = window._tdUid || '';
  return {
    bracket: new URL('../audience/bracket.html?org=' + encodeURIComponent(orgId), location.href).href,
    summary: new URL('../audience/index.html?org=' + encodeURIComponent(orgId), location.href).href
  };
}

function publishLiveBracket() {
  const btn = document.getElementById('publishbtn');
  if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
  tdLiveWrite(tdLiveBracketFields(), 'publish').then(ok => {
    S.remoteSynced = ok; // a publish that reaches the doc also proves the link
    if (ok) {
      S.remotePubHash = tdLiveFingerprint();
      S.remoteLastPub = Date.now();
    }
    save();
    render();
  });
}

// Decision D (BRACKET-LIVE-SPEC.md §2D) — explicit start, never automatic.
// Copies the branding fields from seduh_handoff AT THIS MOMENT: the viewers are
// on different devices and have no access to the organiser's sessionStorage.
// Mid-event branding changes do not resync — known, accepted limitation (§3).
async function startRemoteDisplay() {
  EventConfig.writeHandoff(); // make sure the handoff reflects the current form state
  let h = {};
  try { h = JSON.parse(sessionStorage.getItem('seduh_handoff') || '{}'); } catch (e) {}
  // ENTITLEMENT IS RESOLVED HERE AND COPIED ALONGSIDE THE DATA IT GOVERNS
  // (BRACKET-LIVE-SPEC.md §2E). The viewers are unauthenticated by design and
  // can never evaluate a tier gate, so the decision is made on the organiser's
  // device, at the one moment the tier is actually knowable.
  const branded = Gates.canAccess('bracket_branding').allowed;

  // DON'T SHIP WHAT THE GATE WITHHOLDS. throwdown_live has open read, so
  // writing the branded fields for an unentitled org would put exactly the
  // fields a paid tier unlocks into a world-readable document — a paywall that
  // holds only because the client agrees not to look. When unentitled the keys
  // are DELETED rather than omitted: merge:true would otherwise preserve values
  // written back when the org was entitled.
  const branding = branded
    ? {
        eventName:     h.eventName     || S.eventName  || '',
        // Data URL, capped at 350KB by EventConfig's uploader — comfortably
        // inside Firestore's 1MiB document limit even alongside a full bracket.
        logoUrl:       h.logoUrl       || null,
        eventSubtitle: h.eventSubtitle || '',
        eventDate:     h.eventDate     || S.eventDate  || '',
        eventVenue:    h.eventVenue    || S.eventVenue || ''
      }
    : {
        eventName:     TD_DELETE,
        logoUrl:       TD_DELETE,
        eventSubtitle: TD_DELETE,
        eventDate:     TD_DELETE,
        eventVenue:    TD_DELETE
      };

  const fields = Object.assign(
    { active: true, branded: branded },
    branding,
    tdLiveBracketFields() // seed the screen immediately, don't leave it blank
  );

  const ok = await tdLiveWrite(fields, 'start remote display');
  S.remoteActive  = true;      // local UI state regardless — fail-open
  S.remoteSynced  = ok;        // ...but never CLAIM it worked when it didn't
  S.remotePubHash = ok ? tdLiveFingerprint() : '';
  if (ok) S.remoteLastPub = Date.now();
  save();
  renderRemotePanel();
  render();
}

async function stopRemoteDisplay() {
  await tdLiveWrite({ active: false }, 'stop remote display');
  S.remoteActive = false;
  save();
  renderRemotePanel();
  render();
}

function openRemotePanel()  { renderRemotePanel(); document.getElementById('remote-modal').style.display = 'flex'; }
function closeRemotePanel() { document.getElementById('remote-modal').style.display = 'none'; }

function renderRemotePanel() {
  const body = document.getElementById('rm-body');
  if (!body) return;
  const signedIn = !!window._tdUid;
  const urls = tdViewerUrls();
  const live = !!S.remoteActive;

  // Three states, not two. Fail-open keeps the organiser in control after a
  // failed write, but the panel must not then ASSERT that the room is watching
  // — the only other evidence was a console warning nobody reads at an event.
  const synced = S.remoteSynced !== false;
  const statusCls  = !live ? 'off' : (synced ? 'on' : 'bad');
  const statusText = !live
    ? 'Off — nothing is being shared'
    : (synced
        ? 'Live — the room is following this bracket'
        : 'Not synced — the screen is NOT receiving this bracket');
  const status = '<div class="rm-status ' + statusCls + '">'
    + '<span class="rm-dot"></span>' + statusText + '</div>';

  // Not a gate, a precondition: the rules bind writes to the signed-in org, so
  // an anonymous organiser simply has nowhere to write to.
  const authWarn = signedIn ? '' :
    '<p class="hint" style="margin-bottom:.75rem;color:var(--rd)">You are not signed in, so nothing can be shared yet. '
    + 'Scoring still works normally — sign in on the front door to enable the remote display.</p>';

  const linkRow = (label, url, id) =>
    '<div class="rm-link"><div class="rm-link-lbl">' + label + '</div>'
    + '<div class="rm-link-row"><input class="rm-link-url" id="' + id + '" readonly value="' + url + '">'
    + '<button class="btn-o rm-copy" data-copy="' + id + '">Copy</button>'
    + '<a class="btn-o" href="' + url + '" target="_blank" rel="noopener">Open</a></div></div>';

  const links = live
    ? '<div class="rm-links">'
      + linkRow('In-venue bracket — put this on the projector', urls.bracket, 'rm-url-bracket')
      + linkRow('Public summary — share this with people not at the venue', urls.summary, 'rm-url-summary')
      + '</div>'
    : '';

  const lastPub = S.remoteLastPub
    ? '<p class="hint" style="margin-top:.5rem">Last published ' + new Date(S.remoteLastPub).toLocaleTimeString() + '.</p>'
    : '';

  // Same dot, two different causes — say which. "You have not published yet"
  // blames the organiser for a write that failed on its own.
  const unpublished = !tdLiveHasUnpublished() ? ''
    : (synced
        ? '<p class="hint" style="margin-top:.5rem;color:var(--am);font-weight:700">The screen is behind — there are results you have not published yet.</p>'
        : '<p class="hint" style="margin-top:.5rem;color:var(--rd);font-weight:700">Could not reach the display. Nothing has been shared. Check your connection and press '
          + (live ? '“Start remote display” again' : '“Start remote display”') + '.</p>');

  const primary = live
    ? '<button class="btn-o" id="rm-stop" style="width:100%">Stop remote display</button>'
    : '<button class="btn-p" id="rm-start" style="width:100%"' + (signedIn ? '' : ' disabled') + '>Start remote display</button>';

  body.innerHTML = status + authWarn
    + '<p class="hint" style="margin-bottom:.75rem">Results are only shared when you tap <strong>Publish</strong>, '
    + 'so the screen follows your announcement instead of getting ahead of it.</p>'
    + links + lastPub + unpublished
    + '<div style="margin-top:1rem">' + primary + '</div>';

  const startBtn = document.getElementById('rm-start');
  if (startBtn) startBtn.onclick = () => startRemoteDisplay();
  const stopBtn = document.getElementById('rm-stop');
  if (stopBtn) stopBtn.onclick = () => stopRemoteDisplay();
  body.querySelectorAll('.rm-copy').forEach(btn => {
    btn.onclick = () => {
      const input = document.getElementById(btn.dataset.copy);
      if (!input) return;
      input.select();
      // Clipboard API can reject on insecure origins or without focus; the
      // selected text is still there to copy manually, so this never blocks.
      try { navigator.clipboard.writeText(input.value); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} }
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
    };
  });
}

/* ── MUA-06 chrome ── */
function doReset() {
  if (confirm('Reset ALL throwdown data? Cannot be undone.')) {
    STORE.clear(); mid = 0; S = DEFAULT_STATE(); render();
  }
}

function handleToolbarAction(act) {
  if (act === 'export')      generateThrowdownPDF();
  else if (act === 'save')   exportJSON();
  else if (act === 'load')   importJSON();
  else if (act === 'podium') Audience.showPodium();
  else if (act === 'remote') openRemotePanel();
  else if (act === 'reset')  doReset();
}

function buildSheet(overflow, resetInMore) {
  const title = document.getElementById('ms-title');
  const list  = document.getElementById('ms-list');
  if (!list) return;
  if (title) title.textContent = 'More actions';
  const meta = {
    export: { label: 'Export PDF',  icon: '📄' },
    save:   { label: 'Save',        icon: '💾' },
    load:   { label: 'Load',        icon: '📂' },
    podium: { label: 'View podium', icon: '🏆' },
    remote: { label: 'Remote display', icon: '📡' },
  };
  const rows = overflow.map(id => {
    const a = meta[id] || { label: id, icon: '•' };
    return '<button class="ms-item" data-act="' + id + '">'
      + '<span class="ms-ic">' + a.icon + '</span>' + a.label
      + '</button>';
  }).join('');
  const reset = resetInMore
    ? '<div class="ms-divider">Danger zone</div>'
      + '<button class="ms-item ms-reset" data-act="reset">'
      + '<span class="ms-ic">↺</span>Reset event'
      + '<span class="ms-cap">clears all</span>'
      + '</button>'
    : '';
  list.innerHTML = rows + reset;
  list.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => { closeSheet(); handleToolbarAction(btn.dataset.act); };
  });
}

function fitToolbar() {
  const tb      = document.getElementById('mod-toolbar');
  const moreBtn = document.getElementById('moreBtn');
  if (!tb || !moreBtn) return;
  const secEls  = Array.from(document.querySelectorAll('.tb-sec'));
  const resetEl = document.getElementById('resetbtn');
  const gap     = 8;
  secEls.forEach(el => el.style.display = '');
  if (resetEl) resetEl.style.display = '';
  moreBtn.style.display = 'none';
  const padL  = parseInt(getComputedStyle(tb).paddingLeft);
  const padR  = parseInt(getComputedStyle(tb).paddingRight);
  const avail = tb.clientWidth - padL - padR;
  const required = () => {
    const kids = Array.from(tb.children).filter(c => getComputedStyle(c).display !== 'none');
    let w = 0;
    kids.forEach(c => { w += c.offsetWidth; });
    return w + gap * Math.max(0, kids.length - 1);
  };
  const fits = () => required() <= avail + 1;
  const overflow  = [];
  let resetInMore = false;
  if (!fits()) {
    moreBtn.style.display = 'inline-flex';
    if (resetEl) { resetEl.style.display = 'none'; resetInMore = true; }
    for (let i = secEls.length - 1; i >= 0 && !fits(); i--) {
      secEls[i].style.display = 'none';
      overflow.unshift(secEls[i].dataset.act);
    }
  }
  buildSheet(overflow, resetInMore);
  const ct = moreBtn.querySelector('.ct');
  if (ct) ct.textContent = overflow.length + (resetInMore ? 1 : 0);
}

function measure() {
  const hdr  = document.querySelector('.plat-hdr');
  const tabs = document.getElementById('tabs');
  if (hdr && tabs) tabs.style.top = hdr.offsetHeight + 'px';
  const active = tabs && tabs.querySelector('.mtab.on');
  if (active && tabs) tabs.scrollLeft = active.offsetLeft - (tabs.clientWidth - active.offsetWidth) / 2;
}

function openSheet() {
  document.getElementById('more-sheet')?.classList.add('open');
  document.getElementById('sheet-scrim')?.classList.add('open');
}
function closeSheet() {
  document.getElementById('more-sheet')?.classList.remove('open');
  document.getElementById('sheet-scrim')?.classList.remove('open');
}

/* ── Bind ── */
function bind() {
  const $ = id => document.getElementById(id);
  const on = (id,ev,fn) => { const el=$(id); if(el) el.addEventListener(ev,fn); };

  Timer.init();
  Audience.init();
  EventConfig.mount('#event-config-slot');
  on('tmrbtn','click',() => Timer.open());
  on('exportbtn','click',() => generateThrowdownPDF());
  on('pdf-print','click',() => PdfExport.print());
  on('pdf-close','click',() => PdfExport.close());
  on('savejsonbtn','click',() => exportJSON());
  on('loadjsonbtn','click',() => importJSON());
  on('audbtn','click',() => showAudience());
  on('podiumBtn','click',() => Audience.showPodium());
  on('remotebtn','click',() => openRemotePanel());
  on('publishbtn','click',() => publishLiveBracket());
  on('rm-close','click',() => closeRemotePanel());

  // MUA-06 toolbar wiring
  on('moreBtn', 'click', openSheet);
  on('sheet-scrim', 'click', closeSheet);
  if (!chromeInited) {
    chromeInited = true;
    window.addEventListener('scroll', () => {
      const tabs = document.getElementById('tabs');
      const hdr  = document.querySelector('.plat-hdr');
      if (tabs && hdr) tabs.classList.toggle('stuck', window.scrollY > hdr.offsetHeight + 4);
    });
    window.addEventListener('resize', fitToolbar);
  }
  fitToolbar();
  measure();

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click',()=>{S.tab=b.dataset.tab;render();}));

  // Reset
  on('resetbtn','click', doReset);

  // Event info
  [['ev-name','eventName'],['ev-date','eventDate'],['ev-venue','eventVenue']].forEach(([id,key])=>{
    on(id,'input',() => { S[key]=$(id).value; save(); });
  });

  // Judge range
  on('judge-range','input',() => {
    S.judges = +$('judge-range').value;
    $('judge-display').textContent = S.judges;
    save();
  });

  // Redemption
  on('rd-enable','change',() => {
    S.redemption = $('rd-enable').checked;
    const off = 'opacity:.35;pointer-events:none';
    const on2 = '';
    $('rd-rounds').style.cssText = S.redemption ? on2 : off;
    $('rd-cap-row').style.cssText = S.redemption ? on2 : off;
    $('rd-group-row').style.cssText = S.redemption ? on2 : off;
    save();
  });
  on('rd-r1','change',() => { S.redemptionRounds.r1 = $('rd-r1').checked; save(); });
  on('rd-r2','change',() => { S.redemptionRounds.r2 = $('rd-r2').checked; save(); });
  on('rd-cap','change',() => { S.redemptionCap = Math.max(0, +$('rd-cap').value||0); save(); });
  on('rd-group','change',() => { S.redemptionGroupSize = Math.min(4, Math.max(2, +$('rd-group').value||3)); save(); });

  // Wild card
  on('wc-enable','change',() => { S.wildCard = $('wc-enable').checked; save(); });
  on('tp-enable','change',() => { S.thirdPlace = $('tp-enable').checked; save(); });
  on('td-test-enable','change',() => { S.isTest = $('td-test-enable').checked; save(); });
  on('do-draw-wc','click',() => { drawWildCard(); });
  on('wc-continue','click',() => { const btn = $('wc-continue'); continueAfterWildCard(+(btn?.dataset.round||0)); });
  on('skip-wc','click',() => { skipWildCard(); });
  on('do-draw-ll','click',() => { drawLuckyLoser(); });
  on('ll-continue','click',() => { continueAfterLuckyLoser(); });

  // Judges list
  const addJ = () => {
    const inp = $('j-inp'); if (!inp) return;
    const name = inp.value.trim();
    if (name && !S.judgeList.some(j => j.name.toLowerCase()===name.toLowerCase())) {
      S.judgeList.push({ name });
      inp.value=''; render();
    } else inp.value='';
  };
  on('j-add','click', addJ);
  on('j-inp','keydown', e => e.key==='Enter' && addJ());
  document.querySelectorAll('[data-jrm]').forEach(b => b.addEventListener('click',()=>{
    S.judgeList = S.judgeList.filter(j=>j.name!==b.dataset.jrm); render();
  }));

  // Participants
  const addP = () => {
    const inp = $('p-inp'); if (!inp) return;
    const name = inp.value.trim();
    if (name && !S.participants.some(p => p.name.toLowerCase()===name.toLowerCase())) {
      S.participants.push({ name });
      inp.value=''; render();
    } else inp.value='';
  };
  on('p-add','click', addP);
  on('p-inp','keydown', e => e.key==='Enter' && addP());
  document.querySelectorAll('[data-prm]').forEach(b => b.addEventListener('click',()=>{
    S.participants = S.participants.filter(p=>p.name!==b.dataset.prm); render();
  }));

  // Generate bracket
  on('gen-bracket','click',() => {
    mid = 0;
    if (S.manualBracket) {
      S.manualSlots = Math.max(2, +($('mb-slots')?.value) || S.participants.length || 2);
      generateManualBracket();
      S.tab = 'bracket';
    } else {
      generateBracket();
      S.tab = 'bracket';
    }
    render();
  });

  // Manual bracket mode toggle
  on('mb-enable','change',() => { S.manualBracket = $('mb-enable').checked; save(); render(); });
  on('mb-slots','change',() => { S.manualSlots = Math.max(2, +$('mb-slots').value||2); save(); render(); });

  // Manual slot selects — save state without full re-render to preserve focus
  document.querySelectorAll('.ms-sel').forEach(sel => {
    sel.addEventListener('change', () => {
      const pairId = sel.dataset.pair;
      const pos = sel.dataset.pos;
      const pair = S.bracket?.rounds[0]?.pairs.find(p => p.id === pairId);
      if (pair) { pair[pos] = sel.value || null; save(); }
      refreshManualSelects();
    });
  });

  // Start manual bracket
  on('start-manual','click',() => { startManualBracket(); });

  // Score buttons
  document.querySelectorAll('[data-score]').forEach(b => b.addEventListener('click',()=>{
    S.scoringMatchId = b.dataset.score;
    renderScoreModal();
    document.getElementById('score-modal').style.display='flex';
  }));
  document.querySelectorAll('[data-reopen]').forEach(b => b.addEventListener('click',()=>{
    // Find and reset pair for editing
    for (const round of S.bracket.rounds) {
      const p = round.pairs.find(x=>x.id===b.dataset.reopen);
      // A redemption group carries `tiebreaker` instead of `loser`. Clearing
      // the winner without it would leave a stale tiebreak decision attached to
      // a group that is being re-scored. Only reachable since POA-71 gave
      // redemption cards an Edit button at all.
      if (p) { p.winner=null; p.loser=null; if (isPoolRound(round)) p.tiebreaker=null; break; }
    }
    S.scoringMatchId = b.dataset.reopen;
    renderScoreModal();
    document.getElementById('score-modal').style.display='flex';
    render();
  }));
  on('sm-cancel','click', closeScoring);
  on('load-demo','click',()=>{if(confirm('Load demo data? This will replace your current data.')){loadThrowdownDemo();render();}});
}
